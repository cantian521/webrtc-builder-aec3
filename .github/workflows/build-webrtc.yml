name: Build WebRTC M100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      # ==========================================================
      # 1. 拉取仓库内容
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 清理磁盘空间
      # ==========================================================
      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      # ==========================================================
      # 3. 配置 Git 全局
      # ==========================================================
      - name: Configure Git global
        shell: cmd
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global --list

      # ==========================================================
      # 4. 安装 depot_tools
      # ==========================================================
      - name: Install depot_tools
        shell: cmd
        run: |
          cd /d D:\
          if exist depot_tools rmdir /s /q depot_tools
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo D:\depot_tools>> %GITHUB_PATH%
          echo Depot tools installed

      # ==========================================================
      # 5. Bootstrap depot_tools
      # ==========================================================
      - name: Bootstrap depot_tools
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\depot_tools
          call update_depot_tools.bat
          if not exist python3_bin_reldir.txt (
            echo Bootstrap failed: python3_bin_reldir.txt not found
            exit /b 1
          )
          echo === depot_tools content ===
          dir vpython* python3* 2>nul
          echo Bootstrap OK

      # ==========================================================
      # 6. 拉取 WebRTC M100 源码 + 依赖
      # ==========================================================
      - name: Fetch WebRTC M100
        shell: cmd
        env:
          DEPOT_TOOLS_UPDATE: 0
        run: |
          set PATH=D:\depot_tools;%PATH%
          set VPATH=D:\depot_tools
          set PYTHONPATH=D:\depot_tools;%PYTHONPATH%

          if not exist D:\depot_tools\vpython.bat (
            echo @echo off > D:\depot_tools\vpython.bat
            echo call "%%~dp0python3.bat" %%* >> D:\depot_tools\vpython.bat
          )
          echo === vpython.bat ===
          type D:\depot_tools\vpython.bat

          cd /d D:\
          if exist webrtc rmdir /s /q webrtc
          mkdir webrtc
          cd webrtc

          set RETRY=0
          :fetch_loop
          call D:\depot_tools\fetch.bat --nohooks webrtc
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              echo Fetch failed, retrying...
              timeout /t 10 /nobreak
              goto fetch_loop
            ) else (
              echo Fetch failed after 3 attempts.
              exit /b 1
            )
          )

          if not exist src\DEPS (
            echo fetch failed: src\DEPS not found
            exit /b 1
          )

          cd src
          call git checkout -b m100 branch-heads/4896
          cd ..

          set RETRY=0
          :sync_loop
          call gclient sync --nohooks
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              echo gclient sync failed, retrying...
              timeout /t 10 /nobreak
              goto sync_loop
            ) else (
              echo gclient sync failed after 3 attempts.
              exit /b 1
            )
          )

          call gclient runhooks
          echo === runhooks exit code: %errorlevel% (ignored) ===
          exit /b 0

      # ==========================================================
      # 7. 编译前检查磁盘空间
      # ==========================================================
      - name: Check disk space before build
        shell: pwsh
        run: Get-PSDrive D | Select-Object Used,Free

      # ==========================================================
      # 8. 生成构建配置
      # ==========================================================
      - name: gn gen
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src
          call gn gen out/x86_mt --args="is_debug=false target_cpu=\"x86\" is_clang=false is_component_build=false rtc_build_examples=false rtc_build_tools=false rtc_include_tests=false use_custom_libcxx=false treat_warnings_as_errors=false"
          if not exist out\x86_mt\build.ninja (
            echo gn gen failed: build.ninja not generated
            exit /b 1
          )
          echo gn gen OK

      # ==========================================================
      # 9. 列出 audio_processing 相关的 target（调试用）
      # ==========================================================
      - name: List audio_processing targets
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src
          echo === audio_processing related targets ===
          call gn ls out/x86_mt | findstr /i "audio_processing"
          echo === done ===

      # ==========================================================
      # 10. 编译 audio_processing 及其依赖（用完整 target 路径）
      # ==========================================================
      - name: Build audio_processing
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src

          :: 用完整 target 路径，避免 group 空操作
          call ninja -C out/x86_mt modules/audio_processing:audio_processing

          :: 明确编出每个子模块，保证 lib 一定被产出
          call ninja -C out/x86_mt modules/audio_processing/aec3:aec3
          call ninja -C out/x86_mt modules/audio_processing/agc:agc
          call ninja -C out/x86_mt modules/audio_processing/agc2:agc2
          call ninja -C out/x86_mt modules/audio_processing/ns:ns
          call ninja -C out/x86_mt modules/audio_processing/utility:utility
          call ninja -C out/x86_mt modules/audio_processing/transient:transient
          call ninja -C out/x86_mt modules/audio_processing/vad:vad

          :: 基础库
          call ninja -C out/x86_mt common_audio:common_audio
          call ninja -C out/x86_mt rtc_base:rtc_base
          call ninja -C out/x86_mt system_wrappers:system_wrappers

      # ==========================================================
      # 11. 收集 .lib 和 .h
      # ==========================================================
      - name: Package libs and headers
        shell: pwsh
        run: |
          $src = "D:\webrtc\src"

          # 打印所有编出来的 lib（调试用）
          Write-Host "=== ALL LIBS IN OUT ==="
          Get-ChildItem -Path "$src\out\x86_mt\obj" -Recurse -Filter "*.lib" |
            Select-Object FullName, Length | Format-Table -AutoSize

          New-Item -ItemType Directory -Force -Path D:\out\libs | Out-Null
          Get-ChildItem -Path "$src\out\x86_mt\obj" -Recurse -Filter "*.lib" |
            Copy-Item -Destination D:\out\libs

          $dst = "D:\out\headers"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $src -Recurse -Filter "*.h" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\out\\' } |
            ForEach-Object {
              $rel = $_.FullName.Substring($src.Length + 1)
              $targetFile = Join-Path $dst $rel
              $targetDir  = Split-Path $targetFile
              if (!(Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              }
              Copy-Item $_.FullName -Destination $targetFile -Force
            }

          Write-Host "=== LIBS COUNT ==="
          (Get-ChildItem D:\out\libs).Count
          Write-Host "=== HEADERS COUNT ==="
          (Get-ChildItem D:\out\headers -Recurse -Filter *.h).Count

      # ==========================================================
      # 12. 上传 artifact
      # ==========================================================
      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-libs
          path: D:\out\libs\*.lib
          retention-days: 30

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-headers
          path: D:\out\headers
          retention-days: 30
