name: Build WebRTC M100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      - name: Configure Git global
        shell: cmd
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true

      - name: Install depot_tools
        shell: cmd
        run: |
          cd /d D:\
          if exist depot_tools rmdir /s /q depot_tools
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo D:\depot_tools>> %GITHUB_PATH%

      - name: Bootstrap depot_tools
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\depot_tools
          call update_depot_tools.bat
          if not exist python3_bin_reldir.txt exit /b 1
          echo Bootstrap OK

      - name: Fetch WebRTC M100
        shell: cmd
        env:
          DEPOT_TOOLS_UPDATE: 0
        run: |
          set PATH=D:\depot_tools;%PATH%
          set VPATH=D:\depot_tools
          set PYTHONPATH=D:\depot_tools;%PYTHONPATH%

          if not exist D:\depot_tools\vpython.bat (
            echo @echo off > D:\depot_tools\vpython.bat
            echo call "%%~dp0python3.bat" %%* >> D:\depot_tools\vpython.bat
          )

          cd /d D:\
          if exist webrtc rmdir /s /q webrtc
          mkdir webrtc
          cd webrtc

          set RETRY=0
          :fetch_loop
          call D:\depot_tools\fetch.bat --nohooks webrtc
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              timeout /t 10 /nobreak
              goto fetch_loop
            ) else exit /b 1
          )

          if not exist src\DEPS exit /b 1

          cd src
          call git checkout -b m100 branch-heads/4896
          cd ..

          set RETRY=0
          :sync_loop
          call gclient sync --nohooks
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              timeout /t 10 /nobreak
              goto sync_loop
            ) else exit /b 1
          )

          call gclient runhooks
          echo === runhooks exit code: %errorlevel% (ignored) ===
          exit /b 0

      - name: Patch pffft BUILD.gn
        shell: pwsh
        run: |
          $path = "D:\webrtc\src\third_party\pffft\BUILD.gn"
          if (Test-Path $path) {
            $content = Get-Content $path -Raw
            $content = $content -replace '"-Wno-shadow",?', ''
            $content = $content -replace '-Wno-shadow', ''
            Set-Content $path $content -NoNewline
          }

      - name: gn gen
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src
          call gn gen out/x86_mt --args="is_debug=false target_cpu=\"x86\" is_clang=false is_component_build=false rtc_build_examples=false rtc_build_tools=false rtc_include_tests=false use_custom_libcxx=false treat_warnings_as_errors=false"
          if not exist out\x86_mt\build.ninja exit /b 1
          echo gn gen OK

      # ★★★ 新增：打印目录结构和 target
      - name: Dump WebRTC structure and targets
        shell: pwsh
        run: |
          $src = "D:\webrtc\src"
          $env:PATH = "D:\depot_tools;$env:PATH"
          Set-Location $src

          Write-Host "========== modules/audio_processing 子目录 =========="
          Get-ChildItem -Path "$src\modules\audio_processing" -Directory | Select-Object Name

          Write-Host ""
          Write-Host "========== 所有 BUILD.gn (modules/audio_processing) =========="
          Get-ChildItem -Path "$src\modules\audio_processing" -Recurse -Filter "BUILD.gn" |
            Select-Object FullName

          Write-Host ""
          Write-Host "========== gn ls: audio_processing targets =========="
          & gn ls out/x86_mt | Select-String "audio_processing" | ForEach-Object { Write-Host $_.Line }

          Write-Host ""
          Write-Host "========== gn ls: absl targets =========="
          & gn ls out/x86_mt | Select-String "absl" | ForEach-Object { Write-Host $_.Line }

          Write-Host ""
          Write-Host "========== gn ls: rnnoise targets =========="
          & gn ls out/x86_mt | Select-String "rnnoise" | ForEach-Object { Write-Host $_.Line }

          Write-Host ""
          Write-Host "========== gn ls: third_party 主要目录 =========="
          Get-ChildItem -Path "$src\third_party" -Directory |
            Where-Object { $_.Name -match "abseil|rnnoise|json|protobuf|opus" } |
            Select-Object Name

      - name: Build all
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src
          call ninja -k 0 -C out/x86_mt
          echo === ninja exit code: %errorlevel% (ignored) ===
          exit /b 0

      - name: Package libs and headers
        shell: pwsh
        run: |
          $src = "D:\webrtc\src"

          New-Item -ItemType Directory -Force -Path D:\out\libs | Out-Null
          Get-ChildItem -Path "$src\out\x86_mt\obj" -Recurse -Filter "*.lib" |
            Copy-Item -Destination D:\out\libs

          $dst = "D:\out\headers"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $src -Recurse -Filter "*.h" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\out\\' } |
            ForEach-Object {
              $rel = $_.FullName.Substring($src.Length + 1)
              $targetFile = Join-Path $dst $rel
              $targetDir  = Split-Path $targetFile
              if (!(Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              }
              Copy-Item $_.FullName -Destination $targetFile -Force
            }

          Write-Host "=== LIBS COUNT ==="
          (Get-ChildItem D:\out\libs).Count

          Write-Host ""
          Write-Host "=== 关键符号逐个检查 ==="
          $dumpbin = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\dumpbin.exe"
          $symbols = @(
            "InternalAPMConfig",
            "RmsLevel",
            "AnalogGainStatsReporter",
            "CaptureLevelsAdjuster",
            "ThrowStdOutOfRange",
            "throw_bad_optional_access",
            "kInputDenseWeights",
            "DenormalDisabler",
            "WebRtcAecm_Create",
            "WebRtcAgc_Create"
          )
          foreach ($sym in $symbols) {
            $found = $false
            foreach ($lib in Get-ChildItem D:\out\libs -Filter "*.lib") {
              if (-not $found) {
                $hit = & $dumpbin /linkermember $lib.FullName 2>$null | Select-String -SimpleMatch $sym -Quiet
                if ($hit) {
                  Write-Host "FOUND $sym in: $($lib.Name)"
                  $found = $true
                }
              }
            }
            if (-not $found) { Write-Host "MISSING: $sym" }
          }

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-libs
          path: D:\out\libs\*.lib
          retention-days: 30

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-headers
          path: D:\out\headers
          retention-days: 30
