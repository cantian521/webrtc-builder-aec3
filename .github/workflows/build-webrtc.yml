name: Build WebRTC M100

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      - name: Configure Git global
        shell: cmd
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true

      - name: Install depot_tools
        shell: cmd
        run: |
          cd /d D:\
          if exist depot_tools rmdir /s /q depot_tools
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo D:\depot_tools>> %GITHUB_PATH%

      - name: Bootstrap depot_tools
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\depot_tools
          call update_depot_tools.bat
          if not exist python3_bin_reldir.txt exit /b 1
          echo Bootstrap OK

      - name: Fetch WebRTC M100
        shell: cmd
        env:
          DEPOT_TOOLS_UPDATE: 0
        run: |
          set PATH=D:\depot_tools;%PATH%
          set VPATH=D:\depot_tools
          set PYTHONPATH=D:\depot_tools;%PYTHONPATH%

          if not exist D:\depot_tools\vpython.bat (
            echo @echo off > D:\depot_tools\vpython.bat
            echo call "%%~dp0python3.bat" %%* >> D:\depot_tools\vpython.bat
          )

          cd /d D:\
          if exist webrtc rmdir /s /q webrtc
          mkdir webrtc
          cd webrtc

          set RETRY=0
          :fetch_loop
          call D:\depot_tools\fetch.bat --nohooks webrtc
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              timeout /t 10 /nobreak
              goto fetch_loop
            ) else exit /b 1
          )

          if not exist src\DEPS exit /b 1

          cd src
          call git checkout -b m100 branch-heads/4896
          cd ..

          set RETRY=0
          :sync_loop
          call gclient sync --nohooks
          if %errorlevel% neq 0 (
            set /a RETRY+=1
            if !RETRY! lss 3 (
              timeout /t 10 /nobreak
              goto sync_loop
            ) else exit /b 1
          )

          call gclient runhooks
          exit /b 0

      - name: Patch pffft BUILD.gn
        shell: pwsh
        run: |
          $path = "D:\webrtc\src\third_party\pffft\BUILD.gn"
          if (Test-Path $path) {
            $content = Get-Content $path -Raw
            $content = $content -replace '"-Wno-shadow",?', ''
            $content = $content -replace '-Wno-shadow', ''
            Set-Content $path $content -NoNewline
          }

      - name: gn gen
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src
          call gn gen out/x86_mt --args="is_debug=false target_cpu=\"x86\" is_clang=false is_component_build=false rtc_build_examples=false rtc_build_tools=false rtc_include_tests=false use_custom_libcxx=false treat_warnings_as_errors=false"
          if not exist out\x86_mt\build.ninja exit /b 1
          echo gn gen OK

      - name: Build all + extras
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src

          call ninja -k 0 -C out/x86_mt > D:\build.log 2>&1
          echo === default target done ===

          call ninja -k 0 -C out/x86_mt third_party/abseil-cpp/absl/base:throw_delegate
          call ninja -k 0 -C out/x86_mt third_party/abseil-cpp/absl/types:bad_optional_access
          call ninja -k 0 -C out/x86_mt third_party/abseil-cpp/absl/strings:strings
          call ninja -k 0 -C out/x86_mt third_party/abseil-cpp/absl/base:base
          call ninja -k 0 -C out/x86_mt third_party/abseil-cpp/absl/numeric:int128
          call ninja -k 0 -C out/x86_mt third_party/rnnoise:rnnoise
          call ninja -k 0 -C out/x86_mt third_party/rnnoise:rnn_vad
          call ninja -k 0 -C out/x86_mt modules/audio_processing:rms_level
          call ninja -k 0 -C out/x86_mt modules/audio_processing:audio_processing

          echo === extras done ===
          exit /b 0

      # ★★★ 关键修复：用完整路径调用 lib.exe
      - name: Diagnose and pack missing symbols
        shell: cmd
        run: |
          set PATH=D:\depot_tools;%PATH%
          cd /d D:\webrtc\src\out\x86_mt

          echo ============================================================
          echo [1] 诊断 .obj 是否存在
          echo ============================================================
          dir /s /b obj\modules\audio_processing\*rms_level*.obj 2>nul
          dir /s /b obj\third_party\abseil-cpp\*throw_delegate*.obj 2>nul
          dir /s /b obj\third_party\abseil-cpp\*bad_optional_access*.obj 2>nul
          dir /s /b obj\third_party\rnnoise\*.obj 2>nul

          echo.
          echo ============================================================
          echo [2] 找 lib.exe 的完整路径
          echo ============================================================
          set LIBCMD=
          for /f "delims=" %%i in ('dir /s /b "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x86\lib.exe" 2^>nul') do (
            if not defined LIBCMD set LIBCMD=%%i
          )
          echo LIBCMD=%LIBCMD%

          echo.
          echo ============================================================
          echo [3] 打包 webrtc_missing.lib
          echo ============================================================
          set OBJFILE=objs_for_missing.txt
          if exist %OBJFILE% del %OBJFILE%
          dir /s /b obj\modules\audio_processing\*rms_level*.obj 2>nul >> %OBJFILE%
          dir /s /b obj\third_party\abseil-cpp\*throw_delegate*.obj 2>nul >> %OBJFILE%
          dir /s /b obj\third_party\abseil-cpp\*bad_optional_access*.obj 2>nul >> %OBJFILE%
          dir /s /b obj\third_party\rnnoise\*.obj 2>nul >> %OBJFILE%

          echo ===== objs_for_missing.txt =====
          type %OBJFILE%

          if not exist D:\out\libs mkdir D:\out\libs
          if not exist D:\out\objs mkdir D:\out\objs

          "%LIBCMD%" /OUT:D:\out\libs\webrtc_missing.lib @%OBJFILE%
          echo ===== lib.exe exit code: %errorlevel% =====

          :: 同时把 .obj 复制到 artifact，作为备份
          copy /y obj\modules\audio_processing\rms_level\rms_level.obj D:\out\objs\ 2>nul
          copy /y obj\third_party\abseil-cpp\absl\base\throw_delegate\throw_delegate.obj D:\out\objs\ 2>nul
          copy /y obj\third_party\abseil-cpp\absl\types\bad_optional_access\bad_optional_access.obj D:\out\objs\ 2>nul
          copy /y obj\third_party\rnnoise\rnn_vad\rnn_vad_weights.obj D:\out\objs\ 2>nul

          echo.
          echo ===== D:\out\libs\webrtc_missing.lib =====
          dir D:\out\libs\webrtc_missing.lib 2>nul
          echo ===== D:\out\objs =====
          dir D:\out\objs

          exit /b 0

      - name: Package libs and headers
        shell: pwsh
        run: |
          $src = "D:\webrtc\src"

          New-Item -ItemType Directory -Force -Path D:\out\libs | Out-Null
          Get-ChildItem -Path "$src\out\x86_mt\obj" -Recurse -Filter "*.lib" |
            Copy-Item -Destination D:\out\libs

          $dst = "D:\out\headers"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $src -Recurse -Filter "*.h" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\out\\' } |
            ForEach-Object {
              $rel = $_.FullName.Substring($src.Length + 1)
              $targetFile = Join-Path $dst $rel
              $targetDir  = Split-Path $targetFile
              if (!(Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              }
              Copy-Item $_.FullName -Destination $targetFile -Force
            }

          Write-Host "=== LIBS COUNT ==="
          (Get-ChildItem D:\out\libs).Count

          Write-Host ""
          Write-Host "=== webrtc_missing.lib 符号检查 ==="
          if (Test-Path "D:\out\libs\webrtc_missing.lib") {
            $dumpbin = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\dumpbin.exe"
            $syms = @("RmsLevel", "ThrowStdOutOfRange", "throw_bad_optional_access", "kInputDenseWeights")
            foreach ($s in $syms) {
              $hit = & $dumpbin /linkermember "D:\out\libs\webrtc_missing.lib" 2>$null | Select-String -SimpleMatch $s -Quiet
              if ($hit) { Write-Host "FOUND $s in webrtc_missing.lib" }
              else { Write-Host "MISSING $s" }
            }
          } else {
            Write-Host "webrtc_missing.lib 未生成"
          }

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-libs
          path: D:\out\libs\*.lib
          retention-days: 30

      - name: Upload objs (backup)
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-missing-objs
          path: D:\out\objs
          retention-days: 30

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-m100-headers
          path: D:\out\headers
          retention-days: 30
